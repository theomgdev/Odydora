name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU torch — the suite never touches a GPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # The suite builds models from config with random weights and
        # downloads nothing, so it is safe to run offline in CI.
        env:
          HF_HUB_OFFLINE: "0"
        run: pytest -q

      - name: Notebook stays in sync with its generator
        # The .ipynb is generated, so a hand-edited one is a bug. Regenerate
        # and fail if the committed file differs.
        run: |
          python tools/build_notebook.py
          git diff --exit-code --stat notebooks/odydora_colab.ipynb
